name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Show Maven version
        run: ./mvnw -v

      - name: Compile and static checks
        run: ./mvnw -B -DskipTests compile

      - name: Run unit and integration tests
        run: ./mvnw -B clean verify

      - name: Build Docker image
        run: docker build --tag realtime-trade-processing-simulator:ci .
