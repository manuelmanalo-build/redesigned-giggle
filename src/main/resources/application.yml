spring:
  application:
    name: realtime-trade-processing-simulator
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trade_simulator}
    username: ${SPRING_DATASOURCE_USERNAME:trade_user}
    password: ${SPRING_DATASOURCE_PASSWORD:trade_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  artemis:
    mode: native
    broker-url: ${SPRING_ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${SPRING_ARTEMIS_USER:artemis}
    password: ${SPRING_ARTEMIS_PASSWORD:artemis}
  jms:
    listener:
      concurrency: ${SPRING_JMS_LISTENER_CONCURRENCY:1}
      max-concurrency: ${SPRING_JMS_LISTENER_MAX_CONCURRENCY:4}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p correlationId=%X{correlationId}"
  level:
    com.realtimetradeprocessing.simulator: INFO

trade:
  messaging:
    order-submitted-queue: ${TRADE_ORDER_SUBMITTED_QUEUE:order.submitted}
    jms-listener-enabled: ${TRADE_JMS_LISTENER_ENABLED:true}
  execution:
    simulated-market-price: ${TRADE_SIMULATED_MARKET_PRICE:100.00}
