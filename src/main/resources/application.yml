spring:
  application:
    name: realtime-trade-processing-simulator
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trade_simulator}
    username: ${SPRING_DATASOURCE_USERNAME:trade_user}
    password: ${SPRING_DATASOURCE_PASSWORD:trade_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  artemis:
    mode: native
    broker-url: ${SPRING_ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${SPRING_ARTEMIS_USER:artemis}
    password: ${SPRING_ARTEMIS_PASSWORD:artemis}
  jms:
    listener:
      concurrency: ${SPRING_JMS_LISTENER_CONCURRENCY:1}
      max-concurrency: ${SPRING_JMS_LISTENER_MAX_CONCURRENCY:4}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        trade.messages.processing.duration: 0.5,0.95,0.99
        hikaricp.connections.acquire: 0.5,0.95,0.99
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p correlationId=%X{correlationId}"
  level:
    com.realtimetradeprocessing.simulator: INFO

trade:
  messaging:
    order-submitted-queue: ${TRADE_ORDER_SUBMITTED_QUEUE:order.submitted}
    jms-listener-enabled: ${TRADE_JMS_LISTENER_ENABLED:true}
    jms-publisher-enabled: ${TRADE_JMS_PUBLISHER_ENABLED:true}
  outbox:
    scheduling-enabled: ${TRADE_OUTBOX_SCHEDULING_ENABLED:true}
    relay-interval-ms: ${TRADE_OUTBOX_RELAY_INTERVAL_MS:1000}
    batch-size: ${TRADE_OUTBOX_BATCH_SIZE:25}
    max-attempts: ${TRADE_OUTBOX_MAX_ATTEMPTS:5}
    initial-backoff-ms: ${TRADE_OUTBOX_INITIAL_BACKOFF_MS:1000}
  execution:
    simulated-market-price: ${TRADE_SIMULATED_MARKET_PRICE:100.00}
